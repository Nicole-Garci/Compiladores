[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cmm"
version = "0.1.0"
description = "Compilador da linguagem C--"
requires-python = ">=3.10"
dependencies = ["anytree>=2.12"]

[project.scripts]
cmm = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.lexer" = ["AFD.json"]
